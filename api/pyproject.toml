[project]
name = "aimeet-api"
version = "0.1.0"
description = "FastAPI backend for the Live Multimodal Decision Agent POC."
readme = { text = "Live Multimodal Decision Agent API.", content-type = "text/plain" }
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "pydantic",
    "pydantic-settings",
    "google-genai",
    "openai",
    "python-multipart",
    "httpx",
    "rapidfuzz",
    "numpy",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
addopts = "-m 'not integration'"
markers = ["integration: hits real providers, requires OPENAI_API_KEY"]
